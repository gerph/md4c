---
# RISC OS CI build of the MarkdownMD4C library and the Markdown2HTML tool.
#
# The build runs in the gerph/riscos-build container. The result is a RISC OS zip
# containing:
#
#   Lib/MarkdownMD4C/{h,o}    the library, as exported for other projects to build against
#   Markdown2HTML,ff8         the command line tool
#
# The archive is named MarkdownMD4C-<version>.zip, where <version> is
# <md4c version>-<n>, and <n> is the total number of commits in the history (as reported by
# `git rev-list --count HEAD`), which only ever increases. This allows more than one release
# of the same md4c version, if the RISC OS port needs correcting.
#
# The 'release' job is triggered when a tag starting with a 'v' is created. The tag must
# be v<version>, eg v0.4.6-558. It creates a draft release, which should be published when
# it has been checked.
#

name: RISC OS

# Controls when the action will run. Triggers the workflow on:
#   * push on any branch.
#   * tag creation for tags beginning with a 'v'
on:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  build-riscos:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container:
      image: gerph/riscos-build:latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      leafname: ${{ steps.version.outputs.leafname }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it.
      # The full history is needed to count the commits for the release number.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build the library
        run: |
          cd src/riscos
          riscos-amu export

      - name: Build the command line tool
        run: |
          cd md2html/riscos
          riscos-amu

      - name: Create archive of the build
        run: |
          mkdir -p Artifacts/Lib
          cp -R "$BUILD_DIR/Export/Lib/MarkdownMD4C" Artifacts/Lib/MarkdownMD4C
          cp md2html/riscos/aif32/Markdown2HTML,ff8 Artifacts/
          cd Artifacts
          riscos-zip ../MarkdownMD4C.zip *

      - name: Give the output a versioned name
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version_major=$(sed '/MD_VERSION_MAJOR / ! d ; s/.*MD_VERSION_MAJOR *(\(.*\))/\1/' src/md4c.h)
          version_minor=$(sed '/MD_VERSION_MINOR / ! d ; s/.*MD_VERSION_MINOR *(\(.*\))/\1/' src/md4c.h)
          version_release=$(sed '/MD_VERSION_RELEASE / ! d ; s/.*MD_VERSION_RELEASE *(\(.*\))/\1/' src/md4c.h)
          base=${version_major}.${version_minor}.${version_release}
          # The total number of commits, so that the number always increases.
          number=$(git rev-list --count HEAD)
          if [[ -z "$number" || "$number" -lt 1 ]] ; then
              echo "Could not work out the number of commits"
              exit 1
          fi
          version="${base}-${number}"
          echo "This is version: $version"
          leafname="MarkdownMD4C-$version.zip"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]] ; then
              echo "Tag $GITHUB_REF_NAME does not match the version v$version"
              exit 1
          fi
          if [ -f MarkdownMD4C.zip ] ; then
              mv MarkdownMD4C.zip "$leafname"
          else
              echo "No archive was built?"
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "leafname=$leafname" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: RISCOS-build
          path: ${{ steps.version.outputs.leafname }}
        # The artifact that is downloadable from the Actions is actually a zip of the artifacts
        # that we supply. So it will be a regular Zip file containing a RISC OS Zip file.

  # The release only triggers when the thing that was pushed was a tag starting with 'v'
  release:
    needs: build-riscos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download built RISC OS binary
        uses: actions/download-artifact@v8
        with:
          name: RISCOS-build

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          name: Release ${{ needs.build-riscos.outputs.version }}
          prerelease: false
          draft: true
          artifacts: "${{ needs.build-riscos.outputs.leafname }}"
          artifactContentType: application/zip
